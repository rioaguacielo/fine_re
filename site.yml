# 사이트 설정 — 이 파일만 고치면 메뉴와 제품 분류가 바뀝니다.
title: (주)파인가든
brand: finegarden
description: 목재간판·우드사인·식물라벨 전문기업 파인가든. 식물원·수목원·공공기관 안내판을 디자인부터 제작, 시공까지.
# 정식 오픈 전에는 true (상단 '리뉴얼 시안' 안내 표시, 검색엔진 차단)
draft: true
# GitHub Pages 주소의 하위 경로. 자체 도메인(finegarden.net)으로 옮기면 "" 로 바꿉니다.
baseurl: /fine_re

company:
  ceo: 박웅준
  bizno: 215-87-62929
  address: 서울시 송파구 송파대로 106-7
  directions: 장지역 1번 출구에서 180m
  tel: 02-443-8272
  fax: 02-443-8273
  email: fine21@hanmail.net

# 견적 문의 폼 — 'google', 'github', 'email' 중 하나를 고릅니다.
#  google : 구글폼. 아래 google.url 에 폼 주소(…/viewform)를 넣습니다.
#  github : 저장소의 이슈 폼(.github/ISSUE_TEMPLATE/quote.yml). 고객에게 GitHub 계정이 필요하고,
#           공개 저장소라면 문의 내용(연락처 포함)이 공개됩니다.
#  email  : 폼 없이 이메일·전화만 안내
# 주소가 비어 있으면 자동으로 email 방식으로 표시됩니다.
quote_form:
  provider: google
  google:
    url: ""            # 예) https://docs.google.com/forms/d/e/XXXX/viewform
    embed: true        # true 면 견적문의 페이지 안에 폼을 바로 보여 줌
    product_entry: ""  # (선택) 제품명 칸 자동 입력용. 예) entry.123456789
  github:
    repo: rioaguacielo/fine_re
    template: quote.yml

# 첫 화면 사진 모자이크에 쓸 제품 (content/products 의 파일 이름, 5개)
# 첫 번째가 가장 크게 나옵니다. 사진을 누르면 그 제품 페이지로 이동합니다.
hero_products: [is-5, ts-3, fg-os-5, fg-wl-16, fg-ala-5]

nav:
  - { key: about, label: 회사소개, url: /about.html }
  - { key: products, label: 제품, url: /products/ }
  - { key: cases, label: 납품사례, url: /cases/ }
  - { key: process, label: 제작안내, url: /process.html }
  - { key: faq, label: FAQ, url: /faq.html }

# 제품 분류. 순서대로 탭이 만들어집니다.
# (Pages CMS 글쓰기 화면의 선택지는 .pages.yml 에도 같이 적어 두어야 합니다.)
categories:
  - name: 안내판
    summary: 종합안내판 · 주제원안내판 · 방향표지판 · 현판
    subs: [종합안내판, 주제원안내판, 방향표지판, 현판, 기타]
  - name: 식물라벨
    summary: 우드라벨 · 알루미늄라벨 · 아크릴라벨
    subs: [우드라벨, 알루미늄라벨, 아크릴라벨, 부속품, 기타]
  - name: 상패·주문제작
    summary: 원목 상패, 기념패, 그 밖의 맞춤 사인
    subs: [상패, 주문제작]
